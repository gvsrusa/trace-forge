name: Deploy to Cloud Run

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  PROJECT_ID: GCP_PROJECT_ID
  REGION: us-central1
  AGENT_SERVICE: traceforge-agent
  WEB_SERVICE: traceforge-web
  REGISTRY: us-central1-docker.pkg.dev/GCP_PROJECT_ID/traceforge

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      # ── Build both images in parallel ──────────────────────────────────────

      - name: Build agent image
        run: |
          docker build \
            -t $REGISTRY/$AGENT_SERVICE:$GITHUB_SHA \
            -t $REGISTRY/$AGENT_SERVICE:latest \
            ./agent

      - name: Build web image
        run: |
          docker build \
            -t $REGISTRY/$WEB_SERVICE:$GITHUB_SHA \
            -t $REGISTRY/$WEB_SERVICE:latest \
            ./web

      # ── Push both images ───────────────────────────────────────────────────

      - name: Push agent image
        run: docker push --all-tags $REGISTRY/$AGENT_SERVICE

      - name: Push web image
        run: docker push --all-tags $REGISTRY/$WEB_SERVICE

      # ── Deploy agent ───────────────────────────────────────────────────────

      - name: Deploy agent to Cloud Run
        run: |
          gcloud run deploy $AGENT_SERVICE \
            --image=$REGISTRY/$AGENT_SERVICE:$GITHUB_SHA \
            --region=$REGION \
            --platform=managed \
            --allow-unauthenticated \
            --memory=2Gi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=2 \
            --timeout=300 \
            --set-env-vars=GOOGLE_GENAI_USE_VERTEXAI=1,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,GOOGLE_CLOUD_LOCATION=global,GEMINI_MODEL=gemini-3-flash-preview,PHOENIX_PROJECT_NAME=traceforge,PHOENIX_COLLECTOR_ENDPOINT=https://app.phoenix.arize.com/s/YOUR_SPACE,FIRESTORE_DATABASE=(default) \
            --set-secrets=PHOENIX_API_KEY=phoenix-api-key:latest,GOOGLE_SEARCH_API_KEY=google-search-api-key:latest,GOOGLE_SEARCH_ENGINE_ID=google-search-engine-id:latest

      # ── Get agent URL, then deploy web ─────────────────────────────────────

      - name: Get agent URL
        id: agent-url
        run: |
          URL=$(gcloud run services describe $AGENT_SERVICE \
            --region=$REGION \
            --format="value(status.url)")
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Deploy web to Cloud Run
        run: |
          gcloud run deploy $WEB_SERVICE \
            --image=$REGISTRY/$WEB_SERVICE:$GITHUB_SHA \
            --region=$REGION \
            --platform=managed \
            --allow-unauthenticated \
            --memory=512Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=2 \
            --set-env-vars="AGENT_BACKEND_URL=${{ steps.agent-url.outputs.url }}" \
            --set-secrets=PHOENIX_API_KEY=phoenix-api-key:latest

      - name: Print live URLs
        run: |
          echo "Agent: ${{ steps.agent-url.outputs.url }}"
          echo "Web:   $(gcloud run services describe $WEB_SERVICE --region=$REGION --format='value(status.url)')"
