steps:
  # ── Agent ──────────────────────────────────────────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    id: build-agent
    args:
      - build
      - -t
      - gcr.io/$PROJECT_ID/traceforge-agent:$COMMIT_SHA
      - -t
      - gcr.io/$PROJECT_ID/traceforge-agent:latest
      - ./agent

  - name: "gcr.io/cloud-builders/docker"
    id: push-agent
    waitFor: [build-agent]
    args: [push, "--all-tags", "gcr.io/$PROJECT_ID/traceforge-agent"]

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: deploy-agent
    waitFor: [push-agent]
    entrypoint: gcloud
    args:
      - run
      - deploy
      - traceforge-agent
      - --image=gcr.io/$PROJECT_ID/traceforge-agent:$COMMIT_SHA
      - --region=us-central1
      - --platform=managed
      - --allow-unauthenticated
      - --memory=1Gi
      - --cpu=1
      - --min-instances=0
      - --max-instances=2
      - --timeout=300
      - --set-env-vars=GOOGLE_GENAI_USE_VERTEXAI=1,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,GOOGLE_CLOUD_LOCATION=global,GEMINI_MODEL=gemini-3-flash-preview,PHOENIX_PROJECT_NAME=traceforge,PHOENIX_COLLECTOR_ENDPOINT=https://app.phoenix.arize.com/s/YOUR_SPACE,FIRESTORE_DATABASE=(default)
      - --set-secrets=PHOENIX_API_KEY=phoenix-api-key:latest,GOOGLE_SEARCH_API_KEY=google-search-api-key:latest,GOOGLE_SEARCH_ENGINE_ID=google-search-engine-id:latest

  # ── Web ────────────────────────────────────────────────────────────────────
  - name: "gcr.io/cloud-builders/docker"
    id: build-web
    args:
      - build
      - -t
      - gcr.io/$PROJECT_ID/traceforge-web:$COMMIT_SHA
      - -t
      - gcr.io/$PROJECT_ID/traceforge-web:latest
      - ./web

  - name: "gcr.io/cloud-builders/docker"
    id: push-web
    waitFor: [build-web]
    args: [push, "--all-tags", "gcr.io/$PROJECT_ID/traceforge-web"]

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: get-agent-url
    waitFor: [deploy-agent]
    entrypoint: bash
    args:
      - -c
      - |
        gcloud run services describe traceforge-agent \
          --region=us-central1 \
          --format="value(status.url)" > /workspace/agent_url.txt
        echo "Agent URL: $(cat /workspace/agent_url.txt)"

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: deploy-web
    waitFor: [push-web, get-agent-url]
    entrypoint: bash
    args:
      - -c
      - |
        AGENT_URL=$(cat /workspace/agent_url.txt)
        gcloud run deploy traceforge-web \
          --image=gcr.io/$PROJECT_ID/traceforge-web:$COMMIT_SHA \
          --region=us-central1 \
          --platform=managed \
          --allow-unauthenticated \
          --memory=512Mi \
          --cpu=1 \
          --min-instances=0 \
          --max-instances=2 \
          --set-env-vars="AGENT_BACKEND_URL=${AGENT_URL}" \
          --set-secrets=PHOENIX_API_KEY=phoenix-api-key:latest

images:
  - gcr.io/$PROJECT_ID/traceforge-agent:$COMMIT_SHA
  - gcr.io/$PROJECT_ID/traceforge-web:$COMMIT_SHA

options:
  logging: CLOUD_LOGGING_ONLY
